# huaweicloud-mcp-full — compose standalone.
# Para levantar:  cp .env.example .env  &&  (editá AK/SK)  &&  docker compose up -d --build
#
# Una vez arriba:
#   - hwc-mcp-all:   http://localhost:8888   (streamable HTTP en /mcp) — 174 servicios + BSS billing
#   - terraform-mcp: http://localhost:8088   (streamable HTTP en /mcp) — Terraform Registry lookups
#
# Multi-tenant: con HWC_REQUIRE_PER_REQUEST_CREDS=1, mandá las creds del usuario
# en headers X-Huawei-Access-Key / X-Huawei-Secret-Key / X-Huawei-Region en cada
# request al endpoint /mcp. El contenedor no necesita creds propias.

services:
  # MCP unificado de Huawei Cloud: ~174 servicios (mutaciones) + BSS billing + multi-tenant.
  hwc-mcp-all:
    build: .
    image: huaweicloud-mcp-full:dev
    command: ["-t", "http", "-p", "8080"]
    environment:
      # Cuenta de fallback (modo single-tenant). Con credenciales por request
      # activadas (HWC_REQUIRE_PER_REQUEST_CREDS=1) el contenedor no guarda
      # secretos: las manda la app por header en cada call.
      HUAWEI_ACCESS_KEY: ${HUAWEI_ACCESS_KEY:-}
      HUAWEI_SECRET_KEY: ${HUAWEI_SECRET_KEY:-}
      HUAWEI_REGION: ${HUAWEI_REGION:-la-south-2}
      HWC_REQUIRE_PER_REQUEST_CREDS: ${HWC_REQUIRE_PER_REQUEST_CREDS:-0}
    ports:
      - "8888:8080"
    restart: unless-stopped

  # MCP de Terraform (registry lookups: módulos/providers/versiones).
  # Build local desde el Dockerfile del upstream hashicorp/terraform-mcp-server.
  # Streamable HTTP en /mcp. Sin TFE token → tools de registry público (módulos,
  # providers, versiones); las de registry privado quedan off.
  terraform-mcp:
    build:
      context: ./terraform-mcp
      target: dev
    image: terraform-mcp-server:dev
    command: ["streamable-http", "--transport-host", "0.0.0.0", "--transport-port", "8080"]
    ports:
      - "8088:8080"
    restart: unless-stopped
